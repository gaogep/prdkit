<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>业务后台 — 原型壳</title>
  <style>
    :root {
      --sidebar-bg: #001529;
      --sidebar-text: #bfcbd9;
      --sidebar-hover-bg: rgba(255, 255, 255, 0.08);
      --sidebar-active-bg: rgba(64, 158, 255, 0.15);
      --sidebar-active-bar: #409eff;
      --sidebar-width: 220px;
      --sidebar-collapsed-width: 64px;
      --header-bg: #ffffff;
      --header-border: #e8e8e8;
      --main-bg: #f0f2f5;
      --primary-blue: #409eff;
      --link-blue: #409eff;
      --select-text: #606266;
      --select-border: #dcdfe6;
      --header-height: 60px;
      --font-stack: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      --ease-out: cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      font-family: var(--font-stack);
      font-size: 14px;
      color: #303133;
      background: var(--main-bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    .app-layout {
      display: flex;
      height: 100vh;
      min-height: 100vh;
    }

    /* ========== 左侧栏（#001529 + 业务后台 + 可折叠菜单） ========== */
    .app-sidebar {
      width: var(--sidebar-width);
      min-width: var(--sidebar-width);
      background: var(--sidebar-bg);
      color: var(--sidebar-text);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition:
        width 0.28s var(--ease-out),
        min-width 0.28s var(--ease-out);
      overflow: hidden;
    }

    .app-sidebar.is-collapsed {
      width: var(--sidebar-collapsed-width);
      min-width: var(--sidebar-collapsed-width);
    }

    .app-sidebar.is-collapsed .brand-title,
    .app-sidebar.is-collapsed .menu-label,
    .app-sidebar.is-collapsed .menu-chevron {
      opacity: 0;
      width: 0;
      overflow: hidden;
      margin: 0;
      padding: 0;
      border: 0;
      white-space: nowrap;
    }

    .app-sidebar.is-collapsed .sidebar-brand {
      justify-content: center;
      padding-left: 0;
      padding-right: 0;
    }

    .app-sidebar.is-collapsed .menu-item {
      justify-content: center;
      padding-left: 0;
      padding-right: 0;
    }

    .app-sidebar.is-collapsed .menu-icon {
      margin-right: 0;
    }

    .sidebar-brand {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      height: var(--header-height);
      min-height: var(--header-height);
      padding: 0 12px;
      flex-shrink: 0;
      overflow: visible;
      box-sizing: border-box;
    }

    .brand-logo {
      height: 26px;
      width: auto;
      max-width: 48px;
      min-width: 32px;
      object-fit: contain;
      object-position: left center;
      display: block;
      flex-shrink: 0;
      filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.35));
    }

    .brand-title {
      flex: 1;
      min-width: 0;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.01em;
      white-space: nowrap;
      line-height: 1.2;
      overflow: visible;
      transition: opacity 0.2s var(--ease-out);
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.25);
    }

    .sidebar-menu {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0 16px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255, 255, 255, 0.22) transparent;
    }

    .sidebar-menu::-webkit-scrollbar {
      width: 6px;
    }

    .sidebar-menu::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 6px;
    }

    .sidebar-menu::-webkit-scrollbar-track {
      background: transparent;
    }

    .menu-item {
      display: flex;
      align-items: center;
      padding: 12px 20px;
      color: var(--sidebar-text);
      cursor: pointer;
      user-select: none;
      transition:
        background 0.2s var(--ease-out),
        color 0.2s var(--ease-out),
        box-shadow 0.2s var(--ease-out);
      text-decoration: none;
    }

    .menu-item:hover {
      background: var(--sidebar-hover-bg);
      color: #fff;
    }

    .menu-item:focus-visible {
      outline: 2px solid var(--sidebar-active-bar);
      outline-offset: -2px;
    }

    .menu-item.is-active {
      background: var(--sidebar-active-bg);
      color: #fff;
      box-shadow: inset 4px 0 0 var(--sidebar-active-bar);
    }

    .menu-icon {
      width: 18px;
      height: 18px;
      margin-right: 10px;
      flex-shrink: 0;
      opacity: 0.95;
    }

    .menu-item:hover .menu-icon,
    .menu-item.is-active .menu-icon {
      opacity: 1;
    }

    .menu-label {
      flex: 1;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .menu-chevron {
      width: 12px;
      height: 12px;
      flex-shrink: 0;
      opacity: 0.75;
    }

    /* ========== 右侧：顶栏 + 主区 ========== */
    .app-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--main-bg);
    }

    .app-header {
      height: var(--header-height);
      min-height: var(--header-height);
      background: var(--header-bg);
      border-bottom: 1px solid var(--header-border);
      box-shadow: 0 1px 2px rgba(0, 21, 41, 0.04);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .btn-hamburger {
      width: 40px;
      height: 40px;
      border: none;
      background: transparent;
      cursor: pointer;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 0;
      transition: background 0.2s var(--ease-out);
    }

    .btn-hamburger:hover {
      background: #f5f7fa;
    }

    .btn-hamburger:focus-visible {
      outline: 2px solid var(--primary-blue);
      outline-offset: 2px;
    }

    .btn-hamburger span {
      display: block;
      width: 18px;
      height: 2px;
      background: #606266;
      border-radius: 1px;
      transition: transform 0.2s var(--ease-out), opacity 0.2s var(--ease-out);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header-select-wrap {
      position: relative;
    }

    .header-select {
      appearance: none;
      -webkit-appearance: none;
      height: 32px;
      padding: 0 28px 0 12px;
      font-size: 14px;
      font-family: inherit;
      color: var(--select-text);
      background: #fff;
      border: 1px solid var(--select-border);
      border-radius: 4px;
      cursor: pointer;
      outline: none;
      transition:
        border-color 0.2s var(--ease-out),
        box-shadow 0.2s var(--ease-out);
    }

    .header-select:hover {
      border-color: #c0c4cc;
    }

    .header-select:focus,
    .header-select:focus-visible {
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 3px rgba(64, 158, 255, 0.22);
    }

    .header-select-wrap::after {
      content: "";
      position: absolute;
      right: 10px;
      top: 50%;
      margin-top: -2px;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 5px solid #c0c4cc;
      pointer-events: none;
    }

    .link-jump {
      color: var(--link-blue);
      text-decoration: none;
      font-size: 14px;
      white-space: nowrap;
      border-radius: 2px;
      transition: opacity 0.2s var(--ease-out);
    }

    .link-jump:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .link-jump:focus-visible {
      outline: 2px solid var(--primary-blue);
      outline-offset: 3px;
    }

    .user-block {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #606266;
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #409eff 0%, #66b1ff 100%);
      flex-shrink: 0;
      box-shadow: 0 0 0 2px #fff, 0 1px 4px rgba(0, 21, 41, 0.12);
    }

    /* ========== 主区：浅灰底 + 居中欢迎（主色蓝） ========== */
    .app-main {
      flex: 1;
      min-height: 0;
      background: var(--main-bg);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .welcome-block {
      text-align: center;
      color: var(--primary-blue);
      font-weight: 500;
      line-height: 1.35;
      font-feature-settings: "kern" 1;
      letter-spacing: 0.01em;
    }

    .welcome-block .line-welcome {
      font-size: 40px;
      margin: 0 0 10px 0;
      letter-spacing: 0.04em;
    }

    .welcome-block .line-system {
      font-size: 34px;
      margin: 0;
      letter-spacing: 0.02em;
    }

    #prototype-slot {
      margin-top: 48px;
      max-width: 1200px;
      width: 100%;
      padding: 24px;
      background: #fff;
      border-radius: 4px;
      border: 1px solid rgba(0, 21, 41, 0.04);
      box-shadow:
        0 1px 2px rgba(0, 21, 41, 0.04),
        0 6px 16px rgba(0, 21, 41, 0.06);
      color: #606266;
      font-size: 14px;
      line-height: 1.6;
    }

    #prototype-slot:empty {
      display: none;
    }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="app-sidebar" id="sidebar" aria-label="侧栏导航">
      <div class="sidebar-brand">
        <img class="brand-logo" src="logo.png" alt="Apl" width="72" height="26" decoding="async" />
        <span class="brand-title">业务后台</span>

        <a class="menu-item" href="#">
          <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">

          </svg>

        </a>
        <a class="menu-item" href="#">
          <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <circle cx="12" cy="9" r="3.5" />
            <path d="M6 19c0-3.5 3-5 6-5s6 1.5 6 5" />
          </svg>
          <span class="menu-label">审批管理</span>
          <svg class="menu-chevron" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M7 10l5 5 5-5H7z" />
          </svg>
        </a>
        <a class="menu-item" href="#">
          <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M4 18V6M4 18h16M8 14v4M12 10v8M16 6v12M20 14v4" />
          </svg>
          <span class="menu-label">数据报表</span>
          <svg class="menu-chevron" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M7 10l5 5 5-5H7z" />
          </svg>
        </a>
        <a class="menu-item" href="#">
          <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <rect x="4" y="5" width="16" height="16" rx="2" />
            <path d="M8 3v4M16 3v4M4 11h16" />
          </svg>
          <span class="menu-label">运营工具</span>
          <svg class="menu-chevron" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M7 10l5 5 5-5H7z" />
          </svg>
        </a>
        <a class="menu-item" href="#">
          <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M12 3l2.5 5h5.5l-4.5 3.5 1.7 5.5L12 14.5 6.8 17l1.7-5.5L4 8h5.5L12 3z" />
            <rect x="6" y="15" width="12" height="7" rx="1" />

          <svg class="menu-chevron" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">

        <a class="menu-item" href="#">
          <svg class="menu-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path d="M12 5v2M12 17v2M5 12h2M17 12h2M7.3 7.3l1.4 1.4M15.3 15.3l1.4 1.4M7.3 16.7l1.4-1.4M15.3 8.7l1.4-1.4" />
          </svg>
          <span class="menu-label">系统配置</span>
          <svg class="menu-chevron" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M7 10l5 5 5-5H7z" />
          </svg>
        </a>
      </nav>
    </aside>

    <div class="app-right">
      <header class="app-header" role="banner">
        <div class="header-left">
          <button type="button" class="btn-hamburger" id="btn-toggle-sidebar" aria-label="折叠侧栏" title="折叠侧栏">
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>
        <div class="header-right">
          <div class="header-select-wrap">
            <select class="header-select" aria-label="区域">
              <option selected>TH</option>
            </select>
          </div>
          <a class="link-jump" href="#">跳转TH</a>
          <div class="header-select-wrap">
            <select class="header-select" aria-label="语言">
              <option selected>中文</option>
            </select>
          </div>
          <div class="user-block">
            <span class="user-avatar" aria-hidden="true"></span>
            <span>zhangpengfei</span>
          </div>
        </div>
      </header>

      <main class="app-main" role="main">
        <div class="welcome-block">
          <p class="line-welcome">welcome</p>
          <p class="line-system">业务后台</p>
        </div>
        <!-- 业务原型：表格、表单等追加到下方容器，勿随意改动侧栏与顶栏配色结构 -->
        <div id="prototype-slot">
          <!-- prdkit:slot:start -->
          <!-- prdkit:slot:end -->
        </div>
      </main>
    </div>
  </div>

  <script>
    (function () {
      var sidebar = document.getElementById("sidebar");
      var btn = document.getElementById("btn-toggle-sidebar");
      if (btn && sidebar) {
        btn.addEventListener("click", function () {
          sidebar.classList.toggle("is-collapsed");
        });
      }
    })();
  </script>
</body>
</html>
