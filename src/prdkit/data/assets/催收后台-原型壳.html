<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>催收后台 — 原型壳</title>
  <style>
    :root {
      /* 与截图对齐：顶栏深灰、主背景浅灰、主色蓝 */
      --header-bg: #333333;
      --header-text: #ffffff;
      --main-bg: #f0f2f5;
      --content-bg: #ffffff;
      --primary-blue: #409eff;
      --link-blue: #409eff;
      --select-text: #606266;
      --select-border: #dcdfe6;
      --header-height: 60px;
      --font-stack: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      --ease-out: cubic-bezier(0.4, 0, 0.2, 1);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      font-family: var(--font-stack);
      font-size: 14px;
      color: #303133;
      background: var(--main-bg);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    /* ========== 顶栏（与截图：深色底 + 白字 + 横向菜单） ========== */
    .app-header {
      height: var(--header-height);
      min-height: var(--header-height);
      background: var(--header-bg);
      color: var(--header-text);
      display: flex;
      align-items: center;
      padding: 0 24px;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.06);
    }

    .header-left {
      display: flex;
      align-items: center;
      flex: 1;
      min-width: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      min-width: 0;
      max-width: min(300px, 38vw);
    }

    .brand-logo {
      height: 28px;
      width: auto;
      max-width: 56px;
      min-width: 40px;
      object-fit: contain;
      display: block;
      flex-shrink: 0;
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.2));
    }

    .brand-title {
      font-size: 17px;
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--header-text);
      white-space: nowrap;
      overflow: visible;
      text-overflow: clip;
      flex: 1;
      min-width: 0;
      line-height: 1.2;
      text-shadow: 0 1px 0 rgba(0, 0, 0, 0.22);
    }

    /* 主菜单：紧挨品牌右侧，白字链接 */
    .header-nav {
      display: flex;
      align-items: center;
      gap: 32px;
      margin-left: 40px;
      flex-wrap: nowrap;
    }

    .header-nav a {
      color: var(--header-text);
      text-decoration: none;
      font-size: 14px;
      white-space: nowrap;
      padding: 6px 0;
      border-bottom: 2px solid transparent;
      border-radius: 2px;
      transition:
        opacity 0.2s var(--ease-out),
        border-color 0.2s var(--ease-out),
        color 0.2s var(--ease-out);
    }

    .header-nav a:hover {
      opacity: 0.92;
    }

    .header-nav a:focus-visible {
      outline: 2px solid var(--primary-blue);
      outline-offset: 4px;
    }

    .header-nav a.is-active {
      border-bottom-color: var(--primary-blue);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    /* 截图：白底小下拉框 */
    .header-select-wrap {
      position: relative;
    }

    .header-select {
      appearance: none;
      -webkit-appearance: none;
      height: 32px;
      padding: 0 28px 0 12px;
      font-size: 14px;
      font-family: inherit;
      color: var(--select-text);
      background: var(--content-bg);
      border: 1px solid var(--select-border);
      border-radius: 4px;
      cursor: pointer;
      outline: none;
      transition:
        border-color 0.2s var(--ease-out),
        box-shadow 0.2s var(--ease-out);
    }

    .header-select:hover {
      border-color: #c0c4cc;
    }

    .header-select:focus,
    .header-select:focus-visible {
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 3px rgba(64, 158, 255, 0.22);
    }

    .header-select-wrap::after {
      content: "";
      position: absolute;
      right: 10px;
      top: 50%;
      width: 0;
      height: 0;
      margin-top: -2px;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 5px solid #c0c4cc;
      pointer-events: none;
    }

    .link-jump {
      color: var(--link-blue);
      text-decoration: none;
      font-size: 14px;
      white-space: nowrap;
      border-radius: 2px;
      transition: opacity 0.2s var(--ease-out), text-decoration-color 0.2s var(--ease-out);
    }

    .link-jump:hover {
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .link-jump:focus-visible {
      outline: 2px solid var(--primary-blue);
      outline-offset: 3px;
    }

    .user-block {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--header-text);
      font-size: 14px;
      cursor: default;
      user-select: none;
    }

    .user-block .caret {
      width: 0;
      height: 0;
      border-left: 4px solid transparent;
      border-right: 4px solid transparent;
      border-top: 5px solid rgba(255, 255, 255, 0.85);
      margin-top: 2px;
    }

    /* ========== 主区：浅灰底 + 大白卡片（与截图一致） ========== */
    .app-body {
      min-height: calc(100vh - var(--header-height));
      display: flex;
      flex-direction: column;
    }

    .main-area {
      flex: 1;
      padding: 20px;
      background: var(--main-bg);
    }

    .content-card {
      min-height: calc(100vh - var(--header-height) - 40px);
      background: var(--content-bg);
      border-radius: 4px;
      border: 1px solid rgba(0, 21, 41, 0.04);
      box-shadow:
        0 1px 2px rgba(0, 21, 41, 0.04),
        0 6px 16px rgba(0, 21, 41, 0.06);
      padding: 48px 56px;
    }

    /* 欢迎区：大号主色蓝字，与截图文案一致 */
    .welcome-block {
      color: var(--primary-blue);
      font-weight: 500;
      line-height: 1.35;
      font-feature-settings: "kern" 1;
      letter-spacing: 0.01em;
    }

    .welcome-block .line-welcome {
      font-size: 40px;
      letter-spacing: 0.04em;
      margin: 0 0 8px 0;
      font-weight: 500;
    }

    .welcome-block .line-system {
      font-size: 36px;
      margin: 0;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    /* 业务原型插入区：后续页面内容放在此容器内 */
    #prototype-slot {
      margin-top: 40px;
      padding-top: 32px;
      border-top: 1px dashed #e4e7ed;
      color: #606266;
      font-size: 14px;
      line-height: 1.6;
    }

    #prototype-slot:empty {
      display: none;
    }
  </style>
</head>
<body>
  <header class="app-header" role="banner">
    <div class="header-left">
      <div class="brand">
        <img class="brand-logo" src="logo.png" alt="Apl" width="56" height="28" decoding="async" />
        <span class="brand-title">催收后台</span>
      </div>
      <nav class="header-nav" aria-label="主导航">
        <a href="#" class="is-active">催收任务</a>
        <a href="#">催收报表</a>
        <a href="#">催收设置</a>
        <a href="#">系统管理</a>
      </nav>
    </div>
    <div class="header-right">
      <div class="header-select-wrap">
        <select class="header-select" aria-label="区域">
          <option selected>VN</option>
        </select>
      </div>
      <a class="link-jump" href="#">跳转VN</a>
      <div class="header-select-wrap">
        <select class="header-select" aria-label="语言">
          <option selected>中文</option>
        </select>
      </div>
      <div class="user-block">
        <span>zhangpengfei</span>
        <span class="caret" aria-hidden="true"></span>
      </div>
    </div>
  </header>

  <div class="app-body">
    <main class="main-area" role="main">
      <div class="content-card">
        <div class="welcome-block">
          <p class="line-welcome">welcome</p>
          <p class="line-system">催收后台</p>
        </div>
        <!-- 在此 div 内追加表格、表单等原型区块，勿改顶栏结构以保持与线上一致 -->
        <div id="prototype-slot">
          <!-- prdkit:slot:start -->
          <!-- prdkit:slot:end -->
        </div>
      </div>
    </main>
  </div>
</body>
</html>
